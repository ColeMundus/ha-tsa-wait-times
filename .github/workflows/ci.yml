name: CI
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify Markdown-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          known = {b"README.md", b"CONTRIBUTING.md", b"SECURITY.md", b"CHANGELOG.md"}
          diff = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", os.environ["BASE_SHA"], "HEAD", "--"],
              stdout=subprocess.PIPE,
              check=False,
          )
          paths = diff.stdout.split(b"\0")[:-1]
          docs_only = diff.returncode == 0 and bool(paths) and all(
              path in known or (path.startswith(b"docs/") and path.endswith(b".md"))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs_only={str(docs_only).lower()}", file=output)
          print("Markdown-only draft" if docs_only else "Full validation required")
          PYTHON

  draft-lint:
    if: needs.scope.outputs.docs_only == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: draft-lint
      - run: uv sync --locked
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          exit "$status"
  checks:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft validation' || 'checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14.7'
          enable-cache: true
      - run: uv sync --locked
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --locked ruff check ."
          uv run --locked ruff check . || status=1
          printf "\n> %s\n" "uv run --locked ruff format --check ."
          uv run --locked ruff format --check . || status=1
          printf "\n> %s\n" "uv run --locked mypy"
          uv run --locked mypy || status=1
          exit "$status"
      - run: uv run --locked pytest --cov=custom_components/tsa_wait_times --cov-report=term-missing --cov-fail-under=90
      - run: uv run --locked python scripts/package.py
      - run: git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsa-wait-times-manual-install
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  hassfest:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    needs: scope
    if: ${{ !cancelled() && (github.event.repository.private == false) && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
