name: Bug report
description: Report a reproducible integration problem
body:
  - type: input
    id: version
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove personal information and travel plans.
