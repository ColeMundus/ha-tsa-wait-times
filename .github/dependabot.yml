version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      home-assistant:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
      development-tools:
        patterns:
          - ruff
          - mypy
          - pytest-cov
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
