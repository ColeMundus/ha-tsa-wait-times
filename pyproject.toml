[project]
name = "ha-tsa-wait-times"
version = "0.1.0b0"
description = "TSA security wait times for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.10.0",
  "pytest-homeassistant-custom-component==0.13.371",
  "ruff==0.14.3",
  "mypy==1.18.2",
  "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/tsa_wait_times"]
follow_imports = "silent"
